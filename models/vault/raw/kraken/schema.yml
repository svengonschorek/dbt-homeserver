version: 2

models:
  - name: hub_kraken_transaction
    description: Hub for kraken transaction for the futures account
    columns:
      - name: pk_kraken_transaction
        description: Primary key for kraken transaction hub
        data_tests:
          - not_null
          - unique

  - name: sat_kraken_transaction
    description: Satellite for kraken transactions

  - name: hub_kraken_position
    description: Hub for kraken position for the futures account
    columns:
      - name: pk_kraken_position
        description: Primary key for kraken position hub
        data_tests:
          - not_null
          - unique

  - name: sat_kraken_position
    description: Satellite for kraken positions

  - name: hub_kraken_ticker
    description: Hub for kraken ticker for the futures account
    columns:
      - name: pk_kraken_ticker
        description: Primary key for kraken ticker hub
        data_tests:
          - not_null
          - unique

  - name: sat_kraken_ticker
    description: Satellite for kraken ticker
