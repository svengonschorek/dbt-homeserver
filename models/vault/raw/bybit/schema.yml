version: 2

models:

  - name: hub_bybit_kline
    description: Hub for kline data from the bybit platforms.
    columns:
      - name: pk_bybit_kline
        description: Primary key for the bybit kline hub.
        data_tests:
          - not_null
          - unique

  - name: sat_bybit_kline
    description: Satellite for kline data from the bybit platforms.
  
  - name: hub_bybit_pnl
    description: Hub for PnL from trades in crypto platforms.
    columns:
      - name: pk_bybit_pnl
        description: Primary key for the crypto PnL hub.
        data_tests:
          - not_null
          - unique

  - name: sat_bybit_pnl
    description: Satellite for PnL from trades in crypto platforms.
