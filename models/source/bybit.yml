version: 2

sources:
  - name: bybit
    schema: source
    tables:
      - name: bybit_pnl
        description: PnL from trades the bybit algotrading account.
      - name: bybit_orders
        description: Orders from the bybit algotrading account.
      - name: bybit_trades
        description: Trades from the bybit algotrading account.
      - name: bybit_klines_1m_usdt_eur
        description: 1 minute kline data for USDT/EUR from bybit. Used for backtesting and PnL calculation.
