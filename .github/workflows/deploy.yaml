# .github/workflows/deploy.yml
name: Build and Push

on:
  push:
    branches: [master]
    tags: ["v*"]

env:
  RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/dbt-clickhouse-runtime
  MANIFEST_IMAGE: ghcr.io/${{ github.repository_owner }}/dbt-clickhouse-manifest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACTIONS_TOKEN }}  # No PAT needed in Actions!

      - name: Build and push runtime image
        uses: docker/build-push-action@v4
        with:
          platforms: linux/amd64,linux/arm64
          file: Dockerfile.runtime
          push: true
          tags: ${{ env.RUNTIME_IMAGE }}:${{ github.sha }}

      - name: Build and push manifest image
        uses: docker/build-push-action@v4
        with:
          platforms: linux/amd64,linux/arm64
          file: Dockerfile.manifest
          push: true
          tags: ${{ env.MANIFEST_IMAGE }}:${{ github.sha }}

  promote-release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACTIONS_TOKEN }}

      - name: Re-tag runtime image with semver
        run: |
          docker buildx imagetools create \
            --tag ${{ env.RUNTIME_IMAGE }}:${{ github.ref_name }} \
            ${{ env.RUNTIME_IMAGE }}:${{ github.sha }}

      - name: Re-tag manifest image with semver
        run: |
          docker buildx imagetools create \
            --tag ${{ env.MANIFEST_IMAGE }}:${{ github.ref_name }} \
            ${{ env.MANIFEST_IMAGE }}:${{ github.sha }}
